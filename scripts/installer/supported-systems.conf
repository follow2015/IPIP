# 系统支持矩阵 —— install.sh 与 installer/judge/support.py 的**唯一数据源**
#
# 为什么是纯文本 | 分隔而不是 JSON/YAML：
#   这份表要同时被 **shell 和 Python** 读。而 shell 侧的消费者是最苛刻的 ——
#   CentOS 7 只带 bash 4.2，没有 JSON 解析器，也不该为读一张表去装 jq。
#   `while IFS='|' read -r d v lvl reason advice` 是 bash 的看家活，零依赖。
#
# 为什么拒绝判定必须能在**没有合格 Python** 的机器上完成：
#   installer 全部 .py 都用 3.14 语法。若拒绝判定写在 Python 里，就要求
#   "先有一个能跑的 3.14 才能知道这机器不该装" —— 本末倒置。CentOS 7 自带
#   2.7.5，用户看到的会是一段 pkgutil.py 内部 traceback，完全不知道
#   自己撞上的是"系统不受支持"。
#
# 格式（每行一条，`#` 开头为注释，空行忽略）：
#   发行版|版本前缀|级别|原因|怎么办
#
#   · 版本前缀为空 = 该发行版全系列
#   · 匹配规则是「等于前缀 或 前缀+点」→ "20.04.6" 也命中 "20.04"
#   · 原因/怎么办里的 `\n` 是**字面量两字符**，不是真换行（真换行会破坏
#     "一行一条"）。消费者各自还原：shell 用 printf '%b'，Python 用 .replace()
#   · 怎么办 多条用 `\n` 分隔
#
# 级别：
#   supported —— 有配方，装上就能用
#   rejected  —— 明确拒绝（安装器直接退出）
#   manual    —— 未实测但不拒绝（告知用户"未验证"）
#
# ⚠️ supported 也要显式列出，**不能**"不在表里就算支持"。后者会让新出现的
#    发行版（如 Ubuntu 26.04）被静默归入"未知"，而两者的处理级别不同。
# ⚠️ 未列出的发行版 → manual。

