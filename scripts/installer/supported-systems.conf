# ── el10：AI 功能完整可用（2026-10-03 全流程实测后转正）──────────────
# 与 el9 的关键差别：sqlite。el10 自带 3.46.1（Rocky 10.2 容器内实测），
# 满足 chromadb 的 >= 3.35.0；el9 锁在 3.34.1 且无更新可选。
# 详见 docs/ops/install-behavior-baseline.md §1.3 / §1.4。
#
# supported 的依据是**跑通了完整安装**（2026-10-03，Rocky Linux 10.2）：
#   七个阶段全过 + 安装完成 ✅ + curl /api/health/check → HTTP 200
#   + chromadb 导入成功、RAGStore.available=True（RAG 不降级）。
#
# ⚠️ el10 上 MySQL 与 Redis 的**包名与 el9 不同**，且 Redis 无包可装
#    （2026-10-03 实测；2026-10-04 起 installer 已按 el10 配方**自动安装**，
#    下面这些命令保留作排障参考）：
#
#      · MySQL：包名是 **mysql8.4-server**（appstream 直给 8.4.11），
#               不是 el9 的 mysql-server；服务名仍是 mysqld
#      · Redis：默认源**和 EPEL 都没有 redis-server**，
#               自动装 valkey（appstream 8.0.11，Redis 协议兼容）。
#               已验证到**实际读写路径**（不只是 ping）：缓存读写/TTL、
#               分布式锁、限流、AI 任务状态、幂等（均走 Lua EVAL）、
#               Celery 端到端往返与延迟任务 —— 全部通过。
#               注意 valkey 对外声明 redis_version=7.2.4，客户端按 7.2 协商能力：
#                 dnf install -y valkey
#                 ln -sf /usr/bin/valkey-server /usr/local/bin/redis-server
#                 ln -sf /usr/bin/valkey-cli    /usr/local/bin/redis-cli
#                 systemctl enable --now valkey
#
#    不写清楚就会变成"el10 装不上"的误报 —— 所以下面每条的 advice 都带上。
#
#    ⚠️ 本文件是**逐行解析**的纯数据（shell 与 Python 各读一份，见
#       support.py:_load_matrix），**不支持变量/引用**：写 `_PRE="..."` 这样
#       的行会被当成数据条目，因不是 5 段而直接抛 ValueError。
#       重复几遍文本很难看，但比让整个判定模块崩掉强。
rocky|10|supported|el10 已全流程实测（Rocky 10.2）：安装完成、服务 HTTP 200、RAG 可用。|MySQL 与 Redis 由安装器按 el10 配方自动安装：\n· MySQL：mysql8.4-server（appstream 直给 8.4.11，不是 el9 的 mysql-server），服务名 mysqld\n· Redis：官方源与 EPEL 均无 redis-server，自动装 valkey（Redis 协议兼容）并软链为 redis-server/redis-cli，服务名 valkey\n注意 valkey 对外声明 redis_version=7.2.4，低于 8.0 基线属未验证组合（仅 WARN）
almalinux|10|manual|el10 已在 Rocky 10.2 上全流程实测通过；AlmaLinux 10 未单独验证。|AlmaLinux 10 未实测，属"未验证组合"，请关注安装日志\n安装器自动按 el10 配方装 MySQL（mysql8.4-server）与 Redis（valkey，软链为 redis-server）
