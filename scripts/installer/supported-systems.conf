rhel|10|manual|el10 已在 Rocky 10.2 上全流程实测通过；RHEL 10 需订阅，未单独验证。|RHEL 10 未实测，属"未验证组合"，请关注安装日志\n安装器自动按 el10 配方装 MySQL（mysql8.4-server）与 Redis（valkey，软链为 redis-server）

# ── 明确拒绝 ─────────────────────────────────────────────────────────
# 判据是"跑不动/装不上"，不是"跑得慢"。混淆这两者会把可用环境误杀 ——
# 正因如此 Ubuntu 22.04 在 supported 里，它只是要编译 Python。
centos|7|rejected|CentOS 7 已于 2024-06 EOL，且基础组件版本不足以构建 Python 3.14：glibc 2.17、openssl 1.0.2（缺 OPENSSL_API_3），MySQL 8.4 官方源也无 el7 包。|升级到 Rocky Linux 10 / AlmaLinux 10 / CentOS Stream 10（推荐，el10 配方）\n注意：el9 亦可安装；若 Python 走源码编译，会用系统 sqlite 3.34.1（< 3.35.0）导致 AI 降级，改用 uv 装的 Python 即可避免（自带 3.53.1）\n或自行在系统内装好 Python 3.14 与 MySQL 8.4，再加 --skip-syspkg 重跑
centos|8|rejected|CentOS 8 已 EOL。MySQL 8.4 官方源只提供 el9 / el10，没有 el8 包。|升级到 Rocky Linux 10 / AlmaLinux 10 / CentOS Stream 10（推荐）\nel9 亦可安装；Python 走源码编译时才会撞上系统 sqlite 3.34.1，改用 uv 装的 Python 即可避免\n或自行装好 Python 3.14 与 MySQL 8.4 后加 --skip-syspkg 重跑
rocky|8|rejected|Rocky 8 已 EOL。MySQL 8.4 官方源只提供 el9 / el10。|升级到 Rocky Linux 10（推荐；el10 的 sqlite 3.46.1 达标，AI 功能完整）\nel9 亦可；仅当 Python 走源码编译时会撞上 sqlite 3.34.1，改用 uv 装的 Python 即可避免\n或自行装好前置组件后加 --skip-syspkg 重跑
almalinux|8|rejected|AlmaLinux 8 已 EOL。MySQL 8.4 官方源只提供 el9 / el10。|升级到 AlmaLinux 10（推荐；el10 的 sqlite 3.46.1 达标，AI 功能完整）\nel9 亦可；仅当 Python 走源码编译时会撞上 sqlite 3.34.1，改用 uv 装的 Python 即可避免\n或自行装好前置组件后加 --skip-syspkg 重跑
rhel|7|rejected|RHEL 7 已过维护期，基础组件不足以构建 Python 3.14。|升级到 RHEL 10（需订阅，推荐）或改用 Rocky/AlmaLinux 10\nel9 亦可安装；Python 走源码编译时才会撞上系统 sqlite 3.34.1，改用 uv 装的 Python 即可避免
rhel|8|rejected|RHEL 8 的 MySQL 8.4 需自建源（官方 repo 无 el8 包）。|升级到 RHEL 10（推荐；el10 的 sqlite 达标，AI 功能完整）\nel9 亦可；仅当 Python 走源码编译时会 AI 降级，改用 uv 装的 Python 即可避免\n或自行准备 MySQL 8.4 后加 --skip-syspkg 重跑
ubuntu|18.04|rejected|Ubuntu 18.04 已过标准支持期。glibc 2.27 与 openssl 1.1.0 不足以构建 Python 3.14。|升级到 Ubuntu 24.04 LTS（推荐）\n或自行装好 Python 3.14 后加 --skip-syspkg 重跑
