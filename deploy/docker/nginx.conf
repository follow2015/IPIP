# 反向代理：唯一对外入口。前端用相对路径 /api 与 /realtime，必须由这里分流。
# （见 frontend-new/src/services/api-client.ts:61、useGlobalEvents.ts:256）
server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # ── 后端 API：路径原样透传（Flask 侧就是 /api/...）──
    location /api/ {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ── 实时通道（SSE）：剥掉 /realtime 前缀转发到 ASGI 网关 ──
    # 网关路由是 /sse/... （realtime_gateway/main.py:332-335），
    # 前端请求是 /realtime/sse/... ，故 proxy_pass 必须带结尾斜杠做前缀替换。
    location /realtime/ {
        proxy_pass http://gateway:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host      $host;
        proxy_set_header Connection '';

        # SSE 三件套：关缓冲、关缓存、放宽读超时
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # ── 前端静态资源 + SPA 回退（Flask static_url_path='' 伺服 frontend-new/dist）──
    location / {
        proxy_pass http://web:5000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
