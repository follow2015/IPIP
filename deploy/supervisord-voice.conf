; -*- coding: utf-8 -*-
; 语音通知 Celery worker 的 supervisor 配置（从主仓 supervisord.conf 拆出，仅含 voice worker）
;
; 用法（项目根目录）：
;   ./.venv/bin/supervisord -c deploy/supervisord-voice.conf      # 启动（daemon）
;   ./.venv/bin/supervisorctl -c deploy/supervisord-voice.conf status
;   ./.venv/bin/supervisorctl -c deploy/supervisord-voice.conf tail -f ipip-celery-voice
;   ./.venv/bin/supervisorctl -c deploy/supervisord-voice.conf shutdown
;
; ⚠️ macOS TCC 陷阱：项目位于 ~/Desktop 下受 macOS TCC 保护，supervisord daemon 化 fork
; 后子进程丢失 TCC 授权，无法 bind socket / 创建日志。故运行时文件放 /tmp；
; **生产 Linux 无此问题**，建议改为 /var/run/ipip/ 与 /var/log/ipip/（见各行注释）。
;
; 其它注意：
; 1. 项目路径均为绝对路径，部署副本需按目标机器修改；
; 2. Redis / 密钥等由 config.py 的 load_dotenv() 从 .env 读取（worker 进程
;    import config 时自动加载），此处 environment= 仅固化部署形态开关；
; 3. 与 start.sh 的 nohup 方式互斥——二者只能选一，避免双 worker 抢队列；
; 4. 运维须知：外部 kill -9 worker 主进程会遗留 prefork 孤儿池进程。
;    处置：pkill -f "celery.*-Q voice" 后由 supervisor 自动拉起。正常 stop 不受影响
;    （stopasgroup/killasgroup 会清整组）。
; 5. AI 队列 worker（ipip-celery-ai）不在此配置中——AI 开发完成后从主仓同步完整
;    supervisord.conf 或单独补 ai program 段。

[unix_http_server]
file=/tmp/ipip-sup/supervisor.sock        ; 生产 Linux: /var/run/ipip/supervisor.sock
chmod=0700

[supervisord]
logfile=/tmp/ipip-sup/supervisord.log     ; 生产 Linux: /var/log/ipip/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/ipip-sup/supervisord.pid     ; 生产 Linux: /var/run/ipip/supervisord.pid
childlogdir=/tmp/ipip-sup                 ; 生产 Linux: /var/log/ipip
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/ipip-sup/supervisor.sock  ; 与 [unix_http_server] file 一致

[program:ipip-celery-voice]
; -Q voice：独立消费语音队列（语音 task 声明 queue="voice"）。
; 语音时延敏感（单次呼叫 + 等回调窗口），并发 4 足够覆盖低频告警场景。
; ⚠️ command 中的路径需改为部署机实际路径（.venv 与项目根目录）。
command=/opt/ipip/.venv/bin/celery -A app.celery_app.celery worker -Q voice --concurrency=4 --loglevel=info
directory=/opt/ipip
environment=PYTHONUNBUFFERED="1"
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopasgroup=true
killasgroup=true
; 语音 task 软超时 45s、硬上限由 time_limit 兜底；warm shutdown 等当前呼叫完成
stopwaitsecs=60
stdout_logfile=/tmp/ipip-sup/celery-voice.log  ; 生产 Linux: /var/log/ipip/celery-voice.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
