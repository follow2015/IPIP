name: Schema Smoke

on:
  push:
    branches: [main]
    paths:
      - 'migrations/versions/**'
      - 'scripts/install.sh'
      - 'scripts/import_sql.py'
      - '.github/workflows/schema-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'migrations/versions/**'
      - 'scripts/install.sh'
      - 'scripts/import_sql.py'
      - '.github/workflows/schema-smoke.yml'

permissions:
  contents: read

jobs:
  schema-smoke:
    name: DDL 建表冒烟（MySQL 8.4）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: ip_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # 与 install.sh 的 PyMySQL 回退路径一致，确保 CI 覆盖的就是真实安装路径
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: ip_manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL ready"
              exit 0
            fi
            echo "等待 MySQL... ($i)"
            sleep 2
          done
          echo "❌ MySQL 在 60s 内未就绪"
          exit 1

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pymysql

      # 全新安装的权威 DDL 源是迁移基线（含分区表 + 15 个触发器），
      # 快照覆盖范围由 0000_baseline.covers 清单声明。
      - name: 切分预检（dry-run，不连库）
        run: |
          python3 scripts/import_sql.py migrations/versions/0000_baseline.sql --dry-run

      - name: 导入基线（PyMySQL 路径，DELIMITER 感知）
        run: |
          python3 scripts/import_sql.py migrations/versions/0000_baseline.sql

      # 全新安装的真实升级路径端到端验证：baseline 导入后按 covers 清单
      # stamp 版本（与 install.sh 行为一致），再由 SchemaMigrationRunner 重放
      # 清单之外的剩余迁移链，断言 pending=0 收敛。可捕获两类问题：
      # "基线快照与 covers 清单不一致" 和 "迁移不幂等/依赖错误前置状态"。
      - name: covers stamp + 迁移链重放（全新安装升级路径）
        run: |
          python3 - <<'PYEOF'
          import importlib.util, os, pymysql

          # 独立加载 runner（仅标准库依赖，避免触发 Flask 应用初始化）
          spec = importlib.util.spec_from_file_location(
              "schema_migration_service", "app/services/schema_migration_service.py")
          sms = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sms)

          conn = pymysql.connect(
              host=os.environ["MYSQL_HOST"], port=int(os.environ["MYSQL_PORT"]),
              user=os.environ["MYSQL_USER"], password=os.environ["MYSQL_PASSWORD"],
              database=os.environ["MYSQL_DATABASE"], charset="utf8mb4",
              autocommit=True)

          # 类名以主仓 app/services/schema_migration_service.py 为准：
          # 为 SchemaMigrationRunner（构造签名 (conn, versions_dir)）。
          runner = sms.SchemaMigrationRunner(conn, "migrations/versions")
          chain = [m.version for m in runner._migrations]
          assert runner.applied_versions() == set(), "预期全新库无任何版本记录"

          # 基线重生成有效性：0001 已删除的冗余索引不得再出现在基线里
          cur = conn.cursor()
          cur.execute(
              "SELECT COUNT(*) FROM information_schema.statistics"
              " WHERE table_schema = DATABASE()"
              " AND index_name = 'idx_audit_resource_id'")
          left = cur.fetchone()[0]
          assert left == 0, "baseline 未重生成：idx_audit_resource_id 仍存在"
          cur.close()

          # 读取 covers 清单（与 install.sh 同一解析逻辑）并 stamp
          covered = []
          with open("migrations/versions/0000_baseline.covers", encoding="utf-8") as f:
              for line in f:
                  s = line.strip()
                  if s and not s.startswith("#"):
                      covered.append(s)
          assert covered, "covers 清单为空"
          unknown = [v for v in covered if v not in chain]
          assert not unknown, f"covers 引用了不存在的迁移: {unknown}"

          cur = conn.cursor()
          cur.execute(sms.VERSION_TABLE_DDL)
          for v in covered:
              cur.execute(
                  "INSERT INTO schema_migrations (version, description)"
                  " VALUES (%s, 'baseline')", (v,))
          conn.commit()
          cur.close()
          print("covers stamp:", covered)

          plan = [m.version for m in runner.pending()]
          print("剩余迁移计划:", plan)
          applied_now = runner.run()
          assert applied_now == plan
          assert runner.pending() == [], f"仍有未应用迁移: {runner.pending()}"
          print("✅ baseline + covers → 迁移链重放收敛，pending=0")
          PYEOF

      - name: 验证表数量与关键表存在
        run: |
          q() { mysql -h 127.0.0.1 -uroot ip_manager -N -B -e "$1"; }
          TABLE_COUNT=$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ip_manager'")
          echo "表数量: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 71 ]; then
            echo "❌ 表数量不足（期望 71，实得 $TABLE_COUNT）"
            exit 1
          fi
          for t in users devices network_ports vlans ai_conversations ai_diagnosis_sessions; do
            EXISTS=$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ip_manager' AND table_name='$t'")
            if [ "$EXISTS" != "1" ]; then
              echo "❌ 缺少表: $t"
              exit 1
            fi
            echo "✅ 表存在: $t"
          done

      # 触发器与分区表只有基线能带过来——
      # 这几条断言用于防止 DDL 源被误切回模型生成文件。
      - name: 验证触发器与分区表（基线专属）
        run: |
          q() { mysql -h 127.0.0.1 -uroot ip_manager -N -B -e "$1"; }
          TRG=$(q "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='ip_manager'")
          echo "触发器数量: $TRG"
          if [ "$TRG" -lt 15 ]; then
            echo "❌ 触发器数量不足（期望 15，实得 $TRG）：DDL 源可能不是 baseline"
            exit 1
          fi
          PART=$(q "SELECT COUNT(*) FROM information_schema.partitions WHERE table_schema='ip_manager' AND table_name='device_monitor_probe_events' AND partition_name IS NOT NULL")
          echo "device_monitor_probe_events 分区数: $PART"
          if [ "$PART" -lt 1 ]; then
            echo "❌ device_monitor_probe_events 未建分区"
            exit 1
          fi
          echo "✅ schema 冒烟通过（$TABLE_COUNT 表 / $TRG 触发器 / 分区表就位）"
