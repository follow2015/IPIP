name: Frontend Check

on:
  push:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-check.yml'

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: 前端 lint + 类型检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 由 package.json 的 packageManager 字段安装 pnpm@10.34.5（与主仓 corepack 强制版本一致）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend-new/pnpm-lock.yaml

      - name: 安装依赖（frozen lockfile）
        working-directory: frontend-new
        run: pnpm install --frozen-lockfile

      # 与本地验证口径一致：tsc -b 会连带检查 references 中的 tsconfig.node.json（vite.config.js）
      - name: 类型检查（tsc -b）
        working-directory: frontend-new
        run: pnpm exec tsc -b

      - name: ESLint
        working-directory: frontend-new
        run: pnpm run lint
