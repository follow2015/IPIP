name: Frontend Check

on:
  push:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend-new/**'
      - '.github/workflows/frontend-check.yml'

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: 前端 lint + 类型检查
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 显式锁定 pnpm 版本（与主仓 corepack 强制版本一致）：action-setup 默认读取
      # **仓库根** package.json 的 packageManager，而本仓的字段在 frontend-new/
      # 下，不显式指定会因找不到该字段而失败。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend-new/pnpm-lock.yaml

      - name: 安装依赖（frozen lockfile）
        working-directory: frontend-new
        run: pnpm install --frozen-lockfile

      # 与本地验证口径一致：tsc -b 会连带检查 references 中的 tsconfig.node.json（vite.config.js）
      - name: 类型检查（tsc -b）
        working-directory: frontend-new
        run: pnpm exec tsc -b

      # ⚠️ no-empty 关闭：交付物经 sync 剥离注释，主仓空块的豁免注释
      # （no-empty 默认忽略含注释的块）被剥后变成"真空块"，属剥离副作用而非
      # 交付缺陷——空块语义主仓 CI 已把关（exhaustive-deps 等指令注释
      # strip-comments 已保留，不受影响）。
      - name: ESLint
        working-directory: frontend-new
        run: pnpm exec eslint . --rule '{"no-empty": "off"}'
